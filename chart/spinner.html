<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Spinner</title>
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>
    <style>
        body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        overflow: hidden;
    }
    a {
        color: #000;
        text-decoration: none;
    }

    #section1 {
        width: 100vw;
        height: 100vh;
        position: relative;
    }

    #section1::after {
        content: "";
        position: absolute;
        left: 0; top: 0;
        z-index: -1;
        width: 100%; height: 100%;
        background: url(./images/bg1.png) center/cover no-repeat;
        animation: zoominAni 7s ease-in-out infinite alternate;
        will-change: transform;
    }

    .loading-wrap {
        position: absolute;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 20px;
        justify-content: center;
        align-items: center;
        color: #fff;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
    }

    .spinner {
            position: relative;
            width: 200px;
            height: 200px;
            background: conic-gradient(transparent, lightyellow);
            -webkit-mask: radial-gradient(transparent 89.5px, white 90.5px);
            mask: radial-gradient(transparent 89.5px, white 90.5px);
            border-radius: 50%;
            animation: a-rotate 3000ms ease-in-out infinite;
        }
    .spinner {
        position: relative;
        width: 200px;
        height: 200px;
        background: #ddd;
        -webkit-mask: radial-gradient(transparent 85px, white 86px);
        mask: radial-gradient(transparent 85px, white 86px);
        border-radius: 50%;
        animation: a-rotate 2000ms ease-in-out infinite;
    }

    .spinner::after {
        content: '';
        position: absolute;
        left: 32%;
        height: 22px;
        width: 70px;
        border-radius: 50px;
        background: rgba(158, 87, 255, 1);
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
    }

    #section1 .nav-slide {
        display: flex;
        width: 80%;
        margin: 0 auto;
    }

    #section1 .nav-slide .slick-track{
        display: flex;
        gap: 20px;
        color: #fff;
        font-size: 20px;
    }
    #section1 .nav-slide .slick-track .slick-slide {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #section1 .nav-slide .slick-track .slick-slide a {
        width: 100%;
        display: inline-block;
    }


 /* Slick 화살표 커스터마이징 */
        .slick-prev, .slick-next {
            z-index: 1;
            width: 40px;
            height: 40px;
        }
        
        .slick-prev {
            left: -50px;
        }
        
        .slick-next {
            right: -50px;
        }
        
        .slick-prev:before, .slick-next:before {
            font-size: 30px;
            color: #007bff;
        }
        
        /* 1800px 이하에서만 화살표 표시 */
        @media (min-width: 1801px) {
            .slick-prev, .slick-next {
                display: none !important;
            }
        }
        
        .info {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #e9f4ff;
            border-left: 4px solid #007bff;
            border-radius: 4px;
        }

    @keyframes a-rotate {
        to {
            transform: rotateZ(360deg);
        }
    }

   @keyframes zoominAni {
    0% { transform: scale(1); }
    100% { transform: scale(1.12); }
}
    </style>
</head>

<body>
    <div id="section1">
        <div class="hd_nav">
            <div class="nav-slide">
                <div><a href="javascript:void(0)">nav1</a></div>
                <div><a href="javascript:void(0)">nav2</a></div>
                <div><a href="javascript:void(0)">nav3</a></div>
                <div><a href="javascript:void(0)">nav4</a></div>
                <div><a href="javascript:void(0)">nav5</a></div>
                <div><a href="javascript:void(0)">nav6</a></div>
                <div><a href="javascript:void(0)">nav7</a></div>
            </div>
        </div>
    </div>
    <div class="loading-wrap">
        <div class="spinner" role="status">
            <span class="sr-only">Loading...</span>
        </div>
        <div class="loading-text">Loading</div>
    </div>
<!-- jQuery CDN (필수) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Slick Carousel JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
<script>
$(document).ready(function() {
    const loadingText = document.querySelector('.loading-text');
    if (loadingText) {
        let dotCount = 0;
        setInterval(() => {
            dotCount = (dotCount + 1) % 4;
            loadingText.textContent = 'Loading' + '.'.repeat(dotCount);
        }, 500);
    }

    // Slick 슬라이더 초기화
    $('.nav-slide').slick({
        slidesToShow: 7,        // 기본적으로 모든 메뉴 표시
        slidesToScroll: 1,      
        autoplay: false,        
        dots: false,            
        arrows: false,          // 큰 화면에서는 화살표 숨김
        infinite: false,        
        variableWidth: false,   
        centerMode: false,      
        focusOnSelect: true,
        responsive: [
            {
                breakpoint: 1800,   // 1800px 이하일 때부터 슬라이드 활성화
                settings: {
                    slidesToShow: 5,
                    slidesToScroll: 1,
                    arrows: true,       // 슬라이드가 필요할 때 화살표 표시
                    infinite: false
                }
            },
            {
                breakpoint: 1024,
                settings: {
                    slidesToShow: 3,
                    slidesToScroll: 1,
                    arrows: true
                }
            }
        ]
    });
});
</script>
</body>

</html>
