        .spinner {
            position: relative;
            width: 200px;
            height: 200px;
            background: #ddd;
            -webkit-mask: radial-gradient(transparent 89.5px, white 90.5px);
            mask: radial-gradient(transparent 89.5px, white 90.5px);
            border-radius: 50%;
            animation: a-rotate 3000ms ease-in-out infinite;
        }

        .spinner::after {
            content: '';
            position: absolute;
            left: 50%;
            height: 10px;
            width: 30px;
            border-radius: 30px;
            background: purple;
        }

        @keyframes a-rotate { 
            to { 
                transform: rotateZ(360deg); 
            } 
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
</body>
